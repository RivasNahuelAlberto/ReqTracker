version: '3.9'

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - ANALYTICS_URL=http://analytics:8000
    depends_on:
      - mongodb
      - analytics
    volumes:
      - ./backend:/app
      - /app/node_modules

  analytics:
    build: ./analytics
    ports:
      - "8000:8000"
    volumes:
      - ./analytics:/app
    environment:
      - PYTHONUNBUFFERED=1

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
